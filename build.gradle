 plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'ch.unibas.dmi.dbis'
version = '0.0.1-ALPHA'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'org.golfit.Main'
}

repositories {
    mavenCentral()
}

javafx {
    version = "25"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.base']
}

dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.0")
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'org.jline:jline:3.26.3'
}

test {
    useJUnitPlatform()
}

 tasks.named('jar', Jar) {
     manifest {
         attributes('Main-Class': application.mainClass.get())
     }

     duplicatesStrategy = DuplicatesStrategy.EXCLUDE

     from {
         configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
     }
 }


tasks.register('runBallTest', JavaExec) {
    group = 'application'
    description = 'Runs the BallController physics and graphics test'

    def jfxJars = configurations.runtimeClasspath.filter { it.name.contains('javafx') }
    def nonJfxJars = configurations.runtimeClasspath.filter { !it.name.contains('javafx') }

    classpath = sourceSets.main.output + nonJfxJars
    mainClass = 'org.golfit.client.game.BallTestApp'

    doFirst {
        jvmArgs '--module-path', jfxJars.asPath, '--add-modules', 'ALL-MODULE-PATH'
    }
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Assembles a runnable fat JAR including runtime dependencies.'

    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes('Main-Class': application.mainClass.get())
    }

    // include your compiled classes/resourcesf
    from(sourceSets.main.output)

    // make sure runtimeClasspath is resolved before we try to zipTree it
    dependsOn(configurations.runtimeClasspath)

    // unpack runtime deps into the jar
    from({
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    })
}

plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'jacoco'
    id "com.github.spotbugs" version "6.4.8"
}

group = 'ch.unibas.dmi.dbis'
version = '0.0.1-ALPHA'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'org.golfit.Main'
}

repositories {
    mavenCentral()
}

javafx {
    version = "25"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.base']
}

dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.0")

    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.3'
    implementation 'org.jline:jline:3.26.1'
}

// --- COMPILER & XLINT CONFIGURATION ---
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:all"
    options.fork = true
}

// --- QA & JAVADOC (XDOCLINT) CONFIGURATION ---
tasks.withType(Javadoc).configureEach {
    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.addStringOption('Xdoclint:all', '-quiet')
    options.encoding = 'UTF-8'
    failOnError = false

    doFirst {
        def javadocLogDir = file("${buildDir}/reports/javadoc-log")
        javadocLogDir.mkdirs()
        def logFile = new File(javadocLogDir, "javadoc-warnings.txt")
        logFile.text = ""

        logging.addStandardErrorListener(new StandardOutputListener() {
            void onOutput(CharSequence output) {
                logFile.append(output)
            }
        })
    }
}

jacoco {
    toolVersion = "0.8.14"
}

spotbugs {
    toolVersion = "4.9.8"
    ignoreFailures = true
    showProgress = true
    extraArgs = ["-noClassOk"]


}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
    }
}

test {
    useJUnitPlatform()
    ignoreFailures = true
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['module-info.class', 'META-INF/**', '**/*TestApp*'])
        }))
    }
}

// --- CUSTOM METRICS & ARCHIVING ---

tasks.register('metrics-report') {
    group = 'verification'
    description = 'Runs all quality metrics and archives them for timeline documentation.'

    // SpotBugs is explicitly called here, so it only runs when you want the metrics
    dependsOn test, jacocoTestReport, spotbugsMain, javadoc

    doLast {
        def timestamp = new Date().format('yyyy-MM-dd_HH-mm')
        def archiveDir = file("documentation/qa-history/${timestamp}")

        println "--- ARCHIVING QA METRICS TO: ${archiveDir} ---"
        archiveDir.mkdirs()

        // 1. Archive SpotBugs
        if (file('build/reports/spotbugs/main.html').exists()) {
            copy {
                from 'build/reports/spotbugs/main.html'
                into archiveDir
                rename { "spotbugs-report.html" }
            }
        }

        // 2. Archive JaCoCo
        if (file('build/reports/jacoco/test/html').exists()) {
            copy {
                from 'build/reports/jacoco/test/html'
                into "${archiveDir}/coverage"
            }
        }

        // 3. Archive Javadoc Site
        if (file('build/docs/javadoc').exists()) {
            copy {
                from 'build/docs/javadoc'
                into "${archiveDir}/javadoc-site"
            }
        }

        // 4. Archive Xdoclint Warnings
        def lintFile = file("${buildDir}/reports/javadoc-log/javadoc-warnings.txt")
        if (lintFile.exists()) {
            copy {
                from lintFile
                into archiveDir
            }
            println "Saved Javadoc warnings to history."
        }

        println "Metrics archived successfully."
        println "---------------------------------"
    }
}

tasks.register('build-cs108') {
    group = 'build'
    description = 'Produces executable jar, javadoc and full metrics report.'
    dependsOn 'jar', 'metrics-report'

    doLast {
        println "Build Complete"
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.named('check') {
    dependsOn = dependsOn.findAll {
        task -> !task.toString().contains("spotbugs")
    }
}
plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'jacoco'
    id "com.github.spotbugs" version "6.4.8"
}

group = 'ch.unibas.dmi.dbis'
version = '0.0.1-ALPHA'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'org.golfit.Main'
}

repositories {
    mavenCentral()
}

javafx {
    version = "25"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.base']
}

dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.0")

    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.3'
    implementation 'org.jline:jline:3.26.1'
}

// --- COMPILER & XLINT CONFIGURATION ---
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:all"
    options.fork = true
}

// --- QA & JAVADOC (XDOCLINT) CONFIGURATION ---
tasks.withType(Javadoc).configureEach {
    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.addStringOption('Xdoclint:all', '-quiet')
    options.encoding = 'UTF-8'
    failOnError = false

    // Captures the 100+ Xdoclint issues into a file
    doFirst {
        def javadocLogDir = file("${buildDir}/reports/javadoc-log")
        javadocLogDir.mkdirs()
        def logFile = new File(javadocLogDir, "javadoc-warnings.txt")
        logFile.text = ""

        logging.addStandardErrorListener(new StandardOutputListener() {
            void onOutput(CharSequence output) {
                logFile.append(output)
            }
        })
    }
}

jacoco {
    toolVersion = "0.8.14"
}

spotbugs {
    toolVersion = "4.9.8"
    ignoreFailures = true
    showProgress = true
    extraArgs = ["-noClassOk"]
}

// FIX: Only enable SpotBugs if explicitly requested or running the full report
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    enabled = gradle.startParameter.taskNames.any { it.contains('metrics-report') || it.contains('spotbugs') || it.contains('build-cs108') }
    reports {
        html.required = true
    }
}

test {
    useJUnitPlatform()
    ignoreFailures = true

    // FIX: Properly conditionalize JaCoCo report
    if (gradle.startParameter.taskNames.any { it.contains('metrics-report') || it.contains('build-cs108') }) {
        finalizedBy jacocoTestReport
    }
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['module-info.class', 'META-INF/**', '**/*TestApp*'])
        }))
    }
}

// --- CUSTOM METRICS & ARCHIVING ---

tasks.register('metrics-report') {
    group = 'verification'
    description = 'Runs SpotBugs, JaCoCo, and Javadoc, then archives results.'

    // Ensure JaCoCo and SpotBugs are fully configured before running
    dependsOn test, jacocoTestReport, spotbugsMain, javadoc

    doLast {
        def timestamp = new Date().format('yyyy-MM-dd_HH-mm')
        def archiveDir = file("documentation/qa-history/${timestamp}")

        println "--- GENERATING & ARCHIVING FULL QA REPORT ---"
        archiveDir.mkdirs()

        // 1. Archive SpotBugs
        def spotbugsFile = file('build/reports/spotbugs/main.html')
        if (spotbugsFile.exists()) {
            copy {
                from spotbugsFile
                into archiveDir
                rename { "spotbugs-report.html" }
            }
        }

        // 2. Archive JaCoCo (Coverage)
        def jacocoDir = file('build/reports/jacoco/test/html')
        if (jacocoDir.exists()) {
            copy {
                from jacocoDir
                into "${archiveDir}/coverage"
            }
        }

        // 3. Archive Javadoc Warnings (Xdoclint)
        def lintFile = file("${buildDir}/reports/javadoc-log/javadoc-warnings.txt")
        if (lintFile.exists()) {
            copy {
                from lintFile
                into archiveDir
            }
        }

        println "Saved all reports to: ${archiveDir}"
        println "---------------------------------"
    }
}y

tasks.register('build-cs108') {
    group = 'build'
    description = 'The "Final" build task.'
    dependsOn 'jar', 'metrics-report'
}

tasks.named('jar', Jar) {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
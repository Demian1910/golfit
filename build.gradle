plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'jacoco'
    id "com.github.spotbugs" version "6.4.8"
}

group = 'ch.unibas.dmi.dbis'
version = '0.0.1-ALPHA'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // DOWN-TARGETING: Allows SpotBugs (Class Version 65) to read Java 25 code
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'org.golfit.Main'
}

repositories {
    mavenCentral()
}

javafx {
    version = "25"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.base']
}

dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.0")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.0")


    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.5.3'
    implementation 'org.jline:jline:3.26.1'
}

// --- QA & METRICS CONFIGURATION ---
tasks.withType(Javadoc).configureEach {

    options.memberLevel = JavadocMemberLevel.PRIVATE

    options.addStringOption('Xdoclint:all', '-quiet')

    failOnError = false
}

jacoco {
    toolVersion = "0.8.14" // Latest version with experimental J25 support
}

spotbugs {
    toolVersion = "4.9.8"
    ignoreFailures = true
    showProgress = true
    extraArgs = ["-noClassOk"]
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
    }
}

test {
    useJUnitPlatform()
    ignoreFailures = true
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['module-info.class', 'META-INF/**', '**/*TestApp*'])
        }))
    }
}

javadoc {

    options.addStringOption('Xdoclint:all', '-quiet')
    failOnError = false
}

// --- CUSTOM TASKS ---

tasks.register('metrics-report') {
    group = 'verification'
    description = 'Runs all quality metrics '
    dependsOn test, jacocoTestReport, spotbugsMain, javadoc

    doLast {
        println "--- GOLFIT QA METRICS REPORT ---"
        println "1. Static Analysis (SpotBugs): build/reports/spotbugs/main.html"
        println "2. Code Coverage (JaCoCo):     build/reports/jacoco/test/html/index.html"
        println "3. Doc Quality (Javadoc):      build/docs/javadoc/index.html"
        println "---------------------------------"
    }
}

tasks.register('build-cs108') {
    group = 'build'
    description = 'Produces executable jar, javadoc and full metrics report.'
    dependsOn 'jar', 'javadoc', 'metrics-report'

    doLast {
        println "Build Complete"
    }
}

// Helper task for Fat JAR creation
tasks.named('jar', Jar) {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}